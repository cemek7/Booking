name: VPS Deploy

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cemek7/booking

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.vars.outputs.deploy_env }}
      image_ref: ${{ steps.vars.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck:ci

      - id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DEPLOY_ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref_name }}" == "staging" ]]; then
            DEPLOY_ENV="staging"
          else
            DEPLOY_ENV="production"
          fi

          if [[ "$DEPLOY_ENV" == "staging" ]]; then
            TAG_PREFIX="staging"
          else
            TAG_PREFIX="production"
          fi

          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG_PREFIX}-${GITHUB_SHA}"

          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "tag_prefix=$TAG_PREFIX" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.vps
          push: true
          tags: |
            ${{ steps.vars.outputs.image_ref }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag_prefix }}-latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ needs.build.outputs.deploy_env }}
    steps:
      - name: Resolve deploy credentials
        id: deploy_vars
        env:
          DEPLOY_ENV: ${{ needs.build.outputs.deploy_env }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
        run: |
          host="$VPS_HOST"
          user="${VPS_USER:-deploy}"
          ssh_key="$VPS_SSH_KEY"

          if [[ "$DEPLOY_ENV" == "staging" ]]; then
            host="${host:-$STAGING_HOST}"
            ssh_key="${ssh_key:-$STAGING_DEPLOY_KEY}"
          else
            host="${host:-$PRODUCTION_HOST}"
            ssh_key="${ssh_key:-$PRODUCTION_DEPLOY_KEY}"
          fi

          {
            echo "host=$host"
            echo "user=$user"
            echo "ssh_key<<EOF"
            echo "$ssh_key"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ steps.deploy_vars.outputs.ssh_key }}

      - name: Trust VPS host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ steps.deploy_vars.outputs.host }}" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh "${{ steps.deploy_vars.outputs.user }}@${{ steps.deploy_vars.outputs.host }}" \
            "APP_IMAGE='${{ needs.build.outputs.image_ref }}' \
             GHCR_USERNAME='${{ secrets.GHCR_USERNAME }}' \
             GHCR_TOKEN='${{ secrets.GHCR_TOKEN }}' \
             /usr/local/bin/techclave-deploy '${{ needs.build.outputs.deploy_env }}'"
