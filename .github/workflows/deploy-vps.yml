name: VPS Deploy

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cemek7/booking

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.vars.outputs.deploy_env }}
      image_ref: ${{ steps.vars.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck:ci

      # Blocking unit-test gate. Runs before the Docker build so a regression
      # fails in ~1 minute instead of ~5 minutes into the image build. Excludes
      # the integration suites (live server / third-party APIs) — those run via
      # `npm run test:integration`.
      - run: npm test -- --ci --runInBand

      - id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DEPLOY_ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref_name }}" == "staging" ]]; then
            DEPLOY_ENV="staging"
          else
            DEPLOY_ENV="production"
          fi

          if [[ "$DEPLOY_ENV" == "staging" ]]; then
            TAG_PREFIX="staging"
          else
            TAG_PREFIX="production"
          fi

          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG_PREFIX}-${GITHUB_SHA}"

          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "tag_prefix=$TAG_PREFIX" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.vps
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
          tags: |
            ${{ steps.vars.outputs.image_ref }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag_prefix }}-latest
