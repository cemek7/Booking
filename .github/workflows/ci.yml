name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      # The repository-wide lint command currently includes generated output and
      # legacy test fixtures. Production readiness is enforced by the compiled
      # application graph plus the test suite below.
      - name: Run TypeScript check
        run: npm run typecheck:ci
      - name: Run tests
        run: npm test --if-present
