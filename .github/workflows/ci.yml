name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript check
        run: npm run typecheck:ci
      # Re-enabled: the two reasons this was skipped are gone. Generated output
      # (dist/, .tsbuild/, coverage/) is now in eslint's ignore list, and the
      # legacy test fixtures no longer carry blanket @ts-nocheck directives.
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test --if-present
