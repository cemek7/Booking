# techclave.cloud / www.techclave.cloud — the public Techclave site.
#
# Versioned copy of /etc/nginx/sites-enabled/techclave.cloud.conf on the VPS.
# Install with: sudo install -m 644 deployment/nginx/techclave.cloud.conf
#   /etc/nginx/sites-enabled/techclave.cloud.conf && sudo nginx -t && sudo systemctl reload nginx
#
# Every path is served by the production app. This block used to forward only
# /, /booka* and /_next/*, so the contact page and every legal page returned
# nginx 404s while working on app.techclave.cloud — and nothing checked. The
# catch-all `location /` below is what keeps them reachable, and
# deployment/scripts/check-public-routes.sh verifies it after every deploy.
#
# Sign-in stays on app.techclave.cloud so auth cookies are issued for one host.

server {
    server_name techclave.cloud www.techclave.cloud;

    # Booka's marketing page is served from the booka host, which emits
    # root-absolute asset URLs. Those are rewritten under /booka/ so they do not
    # collide with this site's own /_next and /brand paths.
    location = /booka {
        proxy_pass http://127.0.0.1:3200/booka;
        proxy_http_version 1.1;
        proxy_set_header Host booka.app.techclave.cloud;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;

        # Rewrite only this HTML response.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter '"/_next/' '"/booka/_next/';
        sub_filter '"/brand/' '"/booka/brand/';
    }

    location ^~ /booka/_next/ {
        rewrite ^/booka(/_next/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host booka.app.techclave.cloud;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    location ^~ /booka/brand/ {
        rewrite ^/booka(/brand/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host booka.app.techclave.cloud;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    location = / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host app.techclave.cloud;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host app.techclave.cloud;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /favicon.ico {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host app.techclave.cloud;
    }

    location ^~ /brand/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host app.techclave.cloud;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /booka/auth/ {
        return 302 https://app.techclave.cloud$request_uri;
    }

    location ^~ /auth/ {
        return 302 https://app.techclave.cloud$request_uri;
    }

    # Everything else: the contact page, products, showcase, legal pages and
    # /api/contact, which the contact form posts to from this host.
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host app.techclave.cloud;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/techclave.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/techclave.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.techclave.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = techclave.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name techclave.cloud www.techclave.cloud;
    return 404; # managed by Certbot
}
